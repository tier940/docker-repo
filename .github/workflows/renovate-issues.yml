name: Sync Renovate Dashboard to Issues

# Renovate only ever maintains a single Dependency Dashboard issue. This workflow
# fans that dashboard out into one issue per pending update, so each update has its
# own entry point. renovate.json sets prCreation: "approval", so Renovate pushes
# the real commit to each update's branch but withholds the PR — this workflow
# reads that branch's actual diff (via compareCommits) into the issue body, so an
# issue carries what a PR description would: which files, what changed.

on:
  issues:
    types: [edited, opened]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  DASHBOARD_ISSUE: 7
  QUEUE_LABEL: renovate-queue

jobs:
  sync:
    runs-on: ubuntu-latest
    # Issue events fire for every issue in the repo; only the dashboard matters.
    # A job-level `if` cannot read `env`, so DASHBOARD_ISSUE has to be repeated
    # literally here. Change both together.
    if: github.event_name != 'issues' || github.event.issue.number == 7
    steps:
      - name: Sync dashboard entries to issues
        uses: actions/github-script@v7
        env:
          DASHBOARD_ISSUE: ${{ env.DASHBOARD_ISSUE }}
          QUEUE_LABEL: ${{ env.QUEUE_LABEL }}
        with:
          script: |
            const dashboardNumber = Number(process.env.DASHBOARD_ISSUE);
            const queueLabel = process.env.QUEUE_LABEL;
            const { owner, repo } = context.repo;

            // Checkboxes that act on the dashboard as a whole rather than on a
            // single update. They carry no branch and must never become issues.
            const META_MARKERS = [
              'create-all-rate-limited-prs',
              'rebase-all-open-prs',
              'approve-all-pending-prs',
              'manual job',
              'rebase-check',
            ];

            // Dashboard sections holding updates that are waiting on us. Sections
            // "Detected Dependencies" is skipped — it's informational, not a queue.
            // Taken verbatim from Renovate's dashboard renderer (the `title` argument
            // to getBranchesListMd in lib/workers/repository/dependency-dashboard.ts),
            // lowercased. Every section that means "not merged yet" is listed, so the
            // issue survives from first appearing on the dashboard through to the PR
            // actually landing — not just until a PR exists. "Open" (PR created, not
            // yet merged) is included on purpose: closing the issue as soon as a PR
            // opens would drop in-flight work from the queue.
            const PENDING_SECTIONS = [
              'pending approval',
              'group size not met',
              'awaiting schedule',
              'rate-limited',
              'errored',
              'pr creation approval required',
              'pr edited (blocked)',
              'pending status checks',
              'pending branch automerge',
              'other branches',
              'pr closed (blocked)',
              'open',
            ];

            // Sections that are not pending work: informational headings only.
            // Listed so the unrecognised-section warning stays quiet for them.
            const KNOWN_OTHER_SECTIONS = [
              'detected dependencies',
              'repository problems',
              'deprecations / replacements',
              'abandoned dependencies',
              'vulnerabilities',
              'config migration needed',
            ];

            const dashboard = await github.rest.issues.get({
              owner, repo, issue_number: dashboardNumber,
            });
            const body = dashboard.data.body || '';

            // Walk the body section by section so a checkbox is only picked up when
            // it sits under a heading we consider actionable.
            const entries = new Map();
            const seenSections = [];
            let currentSection = '';
            for (const line of body.split('\n')) {
              // Only `##`. Renovate splits a section into `### <category>` subheadings
              // when updates are categorised, and those must not be read as a change
              // of section or every entry beneath them is dropped.
              const heading = line.match(/^##\s+(.+?)\s*$/);
              if (heading) {
                currentSection = heading[1].toLowerCase();
                seenSections.push(currentSection);
                continue;
              }
              if (!PENDING_SECTIONS.includes(currentSection)) continue;

              const item = line.match(/^\s*-\s*\[[ x]\]\s*<!--\s*(.+?)\s*-->\s*(.*)$/);
              if (!item) continue;

              const marker = item[1];
              if (META_MARKERS.some((m) => marker.includes(m))) continue;

              // Markers look like `unlimit-branch=renovate/postgres-18.x`.
              const branch = marker.split('=').slice(1).join('=').trim();
              if (!branch) continue;

              // Under "Open" the title is itself a markdown link to the PR, e.g.
              // "[Update ubuntu...](../pull/196)" — capture the PR number before
              // stripping the link so the issue can point straight at it.
              const prMatch = item[2].match(/\(\.\.\/pull\/(\d+)\)/);
              const prNumber = prMatch ? Number(prMatch[1]) : null;

              // Strip markdown links so the title reads plainly.
              const title = item[2]
                .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
                .trim();
              if (!title) continue;

              entries.set(branch, { branch, title, section: currentSection, prNumber });
            }

            // Renovate renaming a section would otherwise fail silently: entries
            // get skipped, no issues appear, and nothing errors.
            core.info(`Dashboard sections: ${seenSections.join(', ') || '(none)'}`);
            const unmatched = seenSections.filter(
              (s) => !PENDING_SECTIONS.includes(s) && !KNOWN_OTHER_SECTIONS.includes(s),
            );
            if (unmatched.length) {
              core.warning(`Unrecognised dashboard section(s), entries skipped: ${unmatched.join(', ')}`);
            }
            core.info(`Dashboard lists ${entries.size} pending update(s).`);

            // Dedup against closed issues as well, otherwise every closed issue is
            // recreated on the next run.
            const tracked = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: queueLabel, per_page: 100,
            });

            const byBranch = new Map();
            for (const issue of tracked) {
              if (issue.pull_request) continue; // listForRepo returns PRs too.
              const found = (issue.body || '').match(/<!--\s*renovate-branch=(.+?)\s*-->/);
              if (found) byBranch.set(found[1], issue);
            }

            // prCreation: "approval" makes Renovate push the real commit to the
            // branch and withhold only the PR, so the actual diff already exists —
            // no need to reconstruct it from the dashboard's markdown summary. A
            // branch that isn't pushed yet (still needs-approval with no commits)
            // 404s here; that's normal, not an error, and the issue just falls back
            // to the minimal body.
            async function describeBranch(branch) {
              try {
                const cmp = await github.rest.repos.compareCommits({
                  owner, repo, base: 'main', head: branch,
                });
                const files = cmp.data.files || [];
                return {
                  files: files.map((f) => `\`${f.filename}\` (+${f.additions}/-${f.deletions})`),
                  compareUrl: `../compare/main...${branch}`,
                };
              } catch (err) {
                // 404 means the branch has no commits yet, which is routine for a
                // pending update. Anything else (permissions, rate limit) is a real
                // failure that would otherwise look identical to "nothing to show
                // yet" — surface it instead of silently degrading.
                if (err.status !== 404) {
                  core.warning(`compareCommits failed for ${branch}: ${err.status || err.message}`);
                }
                return null;
              }
            }

            // "No diff yet" means something different depending on why the branch
            // has no commits: an update still waiting its turn will get one; an
            // update whose PR was closed and branch deleted will not, until someone
            // ticks its recreate checkbox on the dashboard.
            function noDiffNote(section) {
              if (section === 'pr closed (blocked)') {
                return [
                  '_No branch to show — its PR was previously closed. Renovate will not',
                  'recreate it until the recreate checkbox for this update is ticked on',
                  `the [Dependency Dashboard](../issues/${dashboardNumber})._`,
                ];
              }
              return [
                '_The branch has no commits yet — Renovate creates it once this',
                "update's turn comes up. Re-check after the next sync._",
              ];
            }

            function renderBody(entry, diff) {
              const lines = [
                'A dependency update is available.',
                '',
                `- **Update**: ${entry.title}`,
                `- **Branch**: \`${entry.branch}\``,
              ];
              if (entry.prNumber) {
                lines.push(`- **Pull request**: #${entry.prNumber}`);
              }
              if (diff && diff.files.length) {
                lines.push('', '**Files changed:**', ...diff.files.map((f) => `- ${f}`));
                lines.push('', `[Compare against main](${diff.compareUrl})`);
              } else if (!entry.prNumber) {
                lines.push('', ...noDiffNote(entry.section));
              }
              lines.push(
                '',
                'Do the update however you like — by hand, by pushing to this branch',
                'yourself, or by opening a PR from it directly. Once the new version has',
                'landed, Renovate stops listing it and this issue closes itself on the',
                'next sync. Closing it yourself means the update is declined, and it',
                'will not be raised again.',
                '',
                `Listed on the [Dependency Dashboard](../issues/${dashboardNumber}) as: ${entry.section}`,
                '',
                `<!-- renovate-branch=${entry.branch} -->`,
              );
              return lines.join('\n');
            }

            let created = 0;
            for (const entry of entries.values()) {
              // A closed issue stays closed. Rejected updates sit on the dashboard
              // under Closed/Ignored indefinitely, so reopening on sight would make
              // an update impossible to decline.
              if (byBranch.has(entry.branch)) continue;

              const diff = await describeBranch(entry.branch);
              const made = await github.rest.issues.create({
                owner, repo,
                title: entry.title,
                body: renderBody(entry, diff),
                labels: [queueLabel, 'dependencies'],
              });
              created += 1;
              core.info(`Created #${made.data.number} for ${entry.branch}`);
            }

            // Keep existing open issues current: a branch with no diff yesterday may
            // have commits today, and this is also how the wording of older issues
            // catches up when the template changes.
            let updated = 0;
            for (const [branch, issue] of byBranch) {
              if (issue.state !== 'open') continue;
              const entry = entries.get(branch);
              if (!entry) continue; // handled by the close pass below
              const diff = await describeBranch(branch);
              const newBody = renderBody(entry, diff);
              if (newBody === issue.body) continue;
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, body: newBody,
              });
              updated += 1;
              core.info(`Updated #${issue.number} for ${branch}`);
            }

            // The close pass below trusts `entries` to be a complete picture of what
            // is pending. If parsing went wrong — a renamed section, an unexpected
            // body — that picture is empty or partial, and closing against it would
            // wipe the queue. Fail loudly instead; creation above is safe to keep.
            // "Nothing pending" is a normal state once everything is up to date, so
            // an empty parse only looks suspicious when no known heading was found
            // at all. Detected Dependencies is always rendered, so a healthy body
            // always matches something here.
            const sawKnownSection = seenSections.some(
              (s) => PENDING_SECTIONS.includes(s) || KNOWN_OTHER_SECTIONS.includes(s),
            );
            if (unmatched.length || (entries.size === 0 && byBranch.size > 0 && !sawKnownSection)) {
              core.setFailed(
                'Dashboard parse looks wrong (unrecognised sections, or no entries ' +
                'while tracking issues exist). Skipping the close pass so the queue ' +
                'is not wiped. Check the section names against issue #' + dashboardNumber + '.',
              );
              return;
            }

            // Anything no longer pending has been approved, merged or superseded.
            let closed = 0;
            for (const [branch, issue] of byBranch) {
              if (issue.state !== 'open' || entries.has(branch)) continue;
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: 'No longer pending on the Dependency Dashboard — closing.',
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed',
              });
              closed += 1;
              core.info(`Closed #${issue.number} for ${branch}`);
            }

            core.notice(`Renovate queue synced: ${created} created, ${updated} updated, ${closed} closed.`);
